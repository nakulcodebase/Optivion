{% extends "base.html" %}

{% block theme %}manager{% endblock %}

{% block content %}
<div class="flex-center" style="min-height: 100vh; padding: 2rem;">
    <a href="{{ url_for('index') }}" class="btn btn-secondary" style="position: absolute; top: 2rem; left: 2rem;">
        <i class="fa-solid fa-arrow-left"></i> Back
    </a>

    <div class="glass-panel animate-fade-in" style="width: 100%; max-width: 400px; padding: 3rem 2rem;">
        <h2 style="font-size: 2rem; margin-bottom: 0.5rem; text-align: center;">Transport Manager</h2>
        <p style="color: var(--text-secondary); text-align: center; margin-bottom: 2rem;">Sign in to manage your fleet</p>

        <form action="{{ url_for('manager_dashboard') }}" method="GET">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-envelope" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="email" class="form-input" style="padding-left: 2.5rem;" placeholder="manager@logistics.com" required />
                </div>
            </div>

            <div class="form-group" style="margin-bottom: 2rem;">
                <label class="form-label">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary);"></i>
                    <input type="password" class="form-input" style="padding-left: 2.5rem;" placeholder="••••••••" required />
                </div>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">
                Authenticate & Login
            </button>

            <div style="margin: 1.5rem 0; display: flex; align-items: center;">
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
                <span style="padding: 0 1rem; color: var(--text-secondary);">OR</span>
                <div style="flex: 1; height: 1px; background: var(--border-color);"></div>
            </div>

            <button type="button" class="btn" style="width: 100%; background: #fff; color: #333; display: flex; justify-content: center; align-items: center; gap: 0.5rem;" onclick="window.location.href='{{ url_for('manager_dashboard') }}'">
                <i class="fa-brands fa-google" style="color: #DB4437;"></i>
                Sign in with Google
            </button>
        </form>
    </div>
</div>
{% endblock %}
